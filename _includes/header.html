<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ '/' | relative_url }}" class="monogram" aria-label="Francisco Zorrilla — home">FZ</a>

    <nav class="nav" aria-label="Primary">
      {% for item in site.data.nav %}
        {% assign current = false %}
        {% if page.url == item.url %}{% assign current = true %}{% endif %}
        {% if item.match and page.url contains item.match %}{% assign current = true %}{% endif %}
        <a class="nav__link" href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
      <span class="theme-toggle__sun" aria-hidden="true">☼</span>
      <span class="theme-toggle__moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>
