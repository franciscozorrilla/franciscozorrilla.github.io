---
layout: default
---
<section class="section">
  <div class="container">
    {% if page.eyebrow or page.title %}
      <header class="section-header">
        {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
        {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
        {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
      </header>
    {% endif %}

    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>
