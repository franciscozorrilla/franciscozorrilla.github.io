<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E0C"/>
      <stop offset="100%" stop-color="#161B17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#7DD3A0" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7DD3A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#7DD3A0"/>

  <!-- monogram -->
  <text x="80" y="120"
        font-family="JetBrains Mono, monospace"
        font-size="36" font-weight="700"
        fill="#7DD3A0">▮ FZ</text>

  <!-- name -->
  <text x="80" y="320"
        font-family="Fraunces, Georgia, serif"
        font-size="84" font-weight="700"
        fill="#E6EDE7">Francisco Zorrilla</text>

  <!-- tagline -->
  <text x="80" y="400"
        font-family="Inter, system-ui, sans-serif"
        font-size="32" font-weight="400"
        fill="#8A968D">Open-source modelling tools for microbial communities,</text>
  <text x="80" y="442"
        font-family="Inter, system-ui, sans-serif"
        font-size="32" font-weight="400"
        fill="#8A968D">applied to food, health and the environment.</text>

  <!-- mono footer -->
  <text x="80" y="560"
        font-family="JetBrains Mono, monospace"
        font-size="22" font-weight="500"
        fill="#7DD3A0">metaGEM · Open to industry roles in Switzerland from Dec 2026</text>
</svg>
