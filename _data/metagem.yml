name: "metaGEM"
oneliner: "Reconstruct genome-scale metabolic models directly from metagenomes — at scale."
description: |
  metaGEM is an end-to-end Snakemake workflow that turns raw metagenomic reads
  into community-level metabolic predictions. Quality control (fastp) → assembly
  (MEGAHIT, metaSPAdes) → binning (CONCOCT, MetaBAT2) → consolidation (MetaWRAP) →
  taxonomy (GTDB-Tk) → metabolic reconstruction (CarveMe) → community simulation
  (SMETANA). Used by labs worldwide; >14,000 GEMs reconstructed across published
  studies.

