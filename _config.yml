title: Francisco Zorrilla
tagline: Computational biologist building production tools for microbiome-scale science.
description: >-
  Francisco Zorrilla — computational biologist (ETH Zürich, ex-EMBL,
  PhD Cambridge), creator of metaGEM. Exploring industry research roles
  in agtech, biotech, and AI-for-bio.
url: https://franciscozorrilla.github.io
baseurl: ""

author:
  name: Francisco Zorrilla
  email: fzorrill@ethz.ch

permalink: /blog/:year/:month/:slug/

collections:
  work:
    output: true
    permalink: /work/:path/

defaults:
  - scope: {path: ""}
    values:
      layout: page
  - scope: {path: "", type: "posts"}
    values:
      layout: post
  - scope: {path: "", type: "work"}
    values:
      layout: work-case-study

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _data

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
  - .bundle

sass:
  style: compressed
  sass_dir: _sass

twitter:
  username: metagenomez
  card: summary_large_image

social:
  name: Francisco Zorrilla
  links:
    - https://www.linkedin.com/in/fzorrilla94/
    - https://github.com/franciscozorrilla
    - https://scholar.google.com/citations?user=byUq0i4AAAAJ&hl=en
    - https://bsky.app/profile/metagenomez.bsky.social
